editor: "nvim"

# Global hooks that run after all workspace syncs complete
hooks:
  postSyncHooks:
    - cmd: ["echo", "All workspaces synced successfully!"]
      description: "Notification hook"
      timeout: 5000
    - cmd: ["deno", "task", "build"]
      description: "Build project after sync"
      workDir: "{root}"
      timeout: 120000
      env:
        NODE_ENV: "development"

workspaces:
  - url: 'git@example.com:org1/repo1.git'
    path: projects/repo1
    branch: fake-branch1
    isGolang: true
    active: false
  - url: 'git@example.com:org2/repo2.git'
    path: modules/repo2
    branch: develop
    isGolang: true
    active: true
    link:
      .agents: .agents
      AGENT.md: prompt/BACKEND.md
    postSyncHooks:
      - cmd: ["go", "mod", "tidy"]
        description: "Clean up Go dependencies"
        workDir: "{path}"
        timeout: 30000
      - cmd: ["go", "test", "./..."]
        description: "Run Go tests"
        workDir: "{path}"
        timeout: 60000
        env:
          GOFLAGS: "-v"
  - url: 'git@fake-domain.net:team-a/k8s-config.git'
    path: deployments/k8s-config
    branch: stable
    isGolang: false
    active: false
  - url: 'git@gitlab.internal:backend-team/traveller-api.git'
    path: services/traveller-api
    branch: main
    isGolang: true
